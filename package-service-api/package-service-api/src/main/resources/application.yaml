server:
  port: 8084
spring:
  application:
    name: package-service-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://127.0.0.1:5432/digital-document-delivery-system?sslmode=disable}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
  cloud:
    function:
      definition:
    stream:
      default-binder: kafka_default
      bindings:
        package-created-out-0:
          destination: event.package-created
          binder: kafka_default
          useNativeDecoding: true
      binders:
        kafka_default:
          type: kafka
          environment:
            spring:
              cloud:
                stream:
                  kafka:
                    default:
                      consumer:
                        configuration:
                          session.timeout.ms: 10000
                          max.poll.records: 10
                      producer:
                        compressionType: gzip
                        configuration:
                          max.request.size: 10000
                    binder:
                      autoAddPartitions: true
                      autoCreateTopics: true
                      requiredAcks: -1
                      minPartitionCount: 3
                      replicationFactor: 1
                      serdeError: logAndContinue
                      broker: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
springdoc:
  api-docs:
    path: /v1/api-docs
  swagger-ui:
    url: /v1/api-docs
    path: /swagger-ui.html
